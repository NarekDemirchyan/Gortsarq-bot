name: arenda

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arenda
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests markdownify playwright
          python -m playwright install --with-deps chromium

      - name: Check syntax
        run: |
          python -c "import ast;ast.parse(open('arenda.py',encoding='utf-8').read());print('syntax ok')"
          grep -n -E '^(CATS|INTERVAL|FRESH_DAYS)' arenda.py

      - name: Run arenda
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_ARENDA: ${{ secrets.TELEGRAM_CHAT_ID_ARENDA }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python arenda.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          rm -rf __pycache__
          git add state-arenda.json
          git commit -m "state-arenda" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
