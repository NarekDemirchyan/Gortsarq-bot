name: gortsarq

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baraxolka
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install --quiet requests cloudscraper playwright

      - name: Install chromium
        continue-on-error: true
        run: |
          python -m playwright install chromium

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python -c "import usercustomize, runpy; runpy.run_path('run.py', run_name='__main__')"

      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for f in state-gortsarq.json state-igma.json published.json turn.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no changes to save"
            exit 0
          fi
          git commit -m "state $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q || true
            if git push; then exit 0; fi
            sleep 5
          done
          echo "push failed"
          exit 1
