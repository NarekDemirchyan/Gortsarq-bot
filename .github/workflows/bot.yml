name: listam bot

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Кто публикует: auto / list / ivi / gortsarq"
        required: false
        default: auto
        type: choice
        options: [auto, list, ivi, gortsarq]

permissions:
  contents: write

concurrency:
  group: baraxolka
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install --quiet requests cloudscraper playwright
          python -m playwright install --with-deps chromium

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE: ${{ inputs.source }}
        run: python run.py

      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state*.json published.json 2>/dev/null || true
          git commit -m "state $(date -u +%Y-%m-%dT%H:%M)" || true
          git pull --rebase --autostash || true
          git push || true
