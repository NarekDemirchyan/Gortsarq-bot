_PW = None
_BRW = None

def _reset():
    global _PW, _BRW
    try:
        if _BRW:
            _BRW.close()
    except Exception:
        pass
    try:
        if _PW:
            _PW.stop()
    except Exception:
        pass
    _BRW = None
    _PW = None

def _browser(url):
    """Настоящий браузер: проходит проверку и отдаёт страницу в markdown.
    Браузер открывается один раз на весь запуск и переиспользуется —
    раньше он поднимался и закрывался на каждой странице, и время уходило
    на это. Картинки не глушим: галерея объявления появляется только после
    их загрузки, поэтому ждём, пока в тексте не будет хотя бы одной."""
    global _BRW, _PW
    try:
        import fetcher
    except Exception as e:
        print(" браузер недоступен:", type(e).__name__)
        return ""

    h, md, pg = "", "", None
    try:
        if _BRW is None:
            from playwright.sync_api import sync_playwright
            _PW = sync_playwright().start()
            _BRW = _PW.chromium.launch(args=["--no-sandbox"])
        pg = _BRW.new_page(user_agent=fetcher.UA, locale="ru-RU")
        pg.goto(url, timeout=45000, wait_until="domcontentloaded")
        for _ in range(5):
            pg.wait_for_timeout(3000)
            h = pg.content()
            if len(h) < 5000 or any(w in h[:4000].lower() for w in BLOCK_WORDS):
                continue
            md = fetcher.to_md(h, url)
            if "![" in md:
                break
    except Exception as e:
        print(" браузер: сбой", type(e).__name__)
        md = ""
        _reset()
    finally:
        try:
            if pg:
                pg.close()
        except Exception:
            pass

    if not md and h:
        md = fetcher.to_md(h, url)
    return md if len(md) > 800 else ""
