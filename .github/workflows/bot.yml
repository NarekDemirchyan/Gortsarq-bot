name: listam bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listam
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests markdownify playwright
          python -m playwright install --with-deps chromium

      - name: Fix code
        run: |
          perl -0777 -i -pe '
          s/\n(main\(\)\s*)$/\nfrom fetcher import jina\n\n$1/m unless /from fetcher import jina/;
          s#if has_cyr\(alt\):#if has_cyr(alt) and not alt.rstrip().endswith(".") and len(alt.split()) >= 3:# unless /endswith\("."\)/;
          s#ok = bool\(cap\) and send\(sess, d, iid, cap\)#ok = bool(cap) and bool(d["photos"]) and send(sess, d, iid, cap)# unless /bool\(d\["photos"\]\)/;
          ' bot.py
          sed -i -E 's|^[[:space:]]*INTERVAL[[:space:]]*=.*|INTERVAL = 10 * 60|' bot.py
          grep -n -E '^[[:space:]]*INTERVAL' bot.py || echo "ԶԳՈՒՇԱՑՈՒՄ. INTERVAL տողը չգտնվեց"
          grep -n "from fetcher" bot.py || true
          if python -m py_compile bot.py; then echo "patch ok"; else echo "patch FAILED"; git checkout -- bot.py; fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json bot.py
          git commit -m "state + fix" || echo "no changes"
          git pull --rebase --autostash || true
          git push || true
