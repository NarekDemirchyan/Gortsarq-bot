name: job

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test — только показать разбор, ничего не публиковать'
        default: 'test'

permissions:
  contents: write

concurrency:
  group: jobam
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          JOB_CHANNEL: ${{ secrets.JOB_CHANNEL }}
        run: python job.py ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
      - name: Save state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state-job.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state-job"
          git pull --rebase --autostash -q || true
          git push
